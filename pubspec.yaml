name: hrm_app
description: "BTrillions HRM app."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Routing and state
  go_router: ^14.0.0
  provider: ^6.1.5+1
  share_plus: ^10.1.0

  # Networking and auth
  dio: ^5.4.0
  flutter_secure_storage: ^10.3.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:

    - assets/logoname.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo1.png"
  remove_alpha_ios: true          # iOS App Store rejects icons with transparency
  min_sdk_android: 21
